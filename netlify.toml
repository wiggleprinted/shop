# Netlify configuration for WigglePrinted static storefront

[build]
  # No build command — this is a plain static site
  publish = "."

[[headers]]
  # Security headers for all pages
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  # Allow Decap CMS to load from CDN
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://netlify-cdp-proxy.netlify.app data: blob:; img-src 'self' data: blob: https:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://netlify-cdp-proxy.netlify.app;"

[[redirects]]
  # Ensure SPA-style admin routing works
  from = "/admin"
  to = "/admin/index.html"
  status = 200
